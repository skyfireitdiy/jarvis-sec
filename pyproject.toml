[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-sec"
version = "0.1.0"
description = "Jarvis Security Scanner: C/C++/Rust security audit tool with heuristic scan and taint analysis"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "skyfireitdiy" },
]
keywords = ["security", "scan", "c", "cpp", "rust", "audit", "jarvis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "jarvis-ai-assistant>=7.0.1",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
joern = []

[project.scripts]
jarvis-sec = "jarvis_sec.cli:main"
jsec = "jarvis_sec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis_sec = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 锁定规则集为经典默认（E4/E7/E9/F），避免新版本 ruff 引入的 UP/BLE 等
# 规则导致 CI 与本地检查结果不一致（与主仓库 jarvis-ai-assistant 保持一致）。
select = ["E4", "E7", "E9", "F"]
